[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handouter-zhiyun-collector"
version = "0.3.0.dev1"
description = "Independent authorized Zhiyun collector for Course Compiler"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "src/handouter_zhiyun_collector/THIRD_PARTY_NOTICES.txt"]
dependencies = ["certifi==2026.7.22", "pywebview==6.1", "keyring==25.6.0"]

[project.scripts]
handouter-zhiyun-collector = "handouter_zhiyun_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handouter_zhiyun_collector = ["THIRD_PARTY_NOTICES.txt", "zhiyun_exporter.user.js"]
