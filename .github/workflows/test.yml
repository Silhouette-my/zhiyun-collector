name: Synthetic tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install certifi==2026.7.22
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: node --check src/handouter_zhiyun_collector/zhiyun_exporter.user.js
